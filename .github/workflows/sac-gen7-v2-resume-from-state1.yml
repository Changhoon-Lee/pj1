name: SAC RLSA Gen7 V2R2 resume from public STATE_1
on:
  push:
    branches: [sac-rlsa-gen7-authoritative-v2]
    paths: [sac_rlsa_gen7v2/resume/RESUME_FROM_STATE1_TRIGGER.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: sac-gen7-v2r2-resume-from-state1
  cancel-in-progress: false
env:
  SOURCE_RUN_ID: '30814530108'
  SOURCE_ARTIFACT_NAME: sac-gen7-v2-target-bytes
jobs:
  freeze-state2:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    outputs:
      state2_commit: ${{ steps.state2.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sac-rlsa-gen7-authoritative-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy==2.3.5
      - name: Verify resume-only public state and trigger
        run: |
          test -f sac_rlsa_gen7v2/state/EXECUTION_LEASE.json
          test -f sac_rlsa_gen7v2/state/STATE_1.json
          test ! -f sac_rlsa_gen7v2/state/STATE_2.json
          test ! -f sac_rlsa_gen7v2/freeze/TARGET_RUN_TRIGGER.json
          python - <<'PY'
          import json
          t=json.load(open('sac_rlsa_gen7v2/resume/RESUME_FROM_STATE1_TRIGGER.json'))
          s=json.load(open('sac_rlsa_gen7v2/state/STATE_1.json'))
          l=json.load(open('sac_rlsa_gen7v2/state/EXECUTION_LEASE.json'))
          assert t['schema']=='SAC_GEN7_V2R2_RESUME_FROM_STATE1_TRIGGER_V1'
          assert t['source_run_id']==30814530108
          assert t['source_artifact_id']==8856162665
          assert t['source_artifact_zip_sha256']=='f8022ab51391b0f42e3f2ab15724bfe4d0229170482272092d72741d988c379b'
          assert t['state1_digest']==s['state_digest']=='f5e5fba6158958487ee2dc86cbdaef6ff930723835d47f0cee8af033ebccddf4'
          assert s['state']==1 and s['seeds_consumed'] and s['target_reports_generated'] and not s['target_truth_accessed']
          assert l['repository_dispatch_run_id']==30814530108
          assert l['target_seed_digest']==s['target_seed_digest']
          assert t['target_seeds']==s['target_seeds']==[884503672,756621450]
          assert t['reporter_rerun_forbidden'] is True and t['full_truth_accessed_before_resume'] is False
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: target_artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Recompute and bind the already-disclosed Freeze B/C
        id: state2
        run: |
          PYTHONDONTWRITEBYTECODE=1 python sac_rlsa_gen7v2/tools/target_freeze_bc.py \
            --freeze-a sac_rlsa_gen7v2/freeze/FREEZE_A_V2_AUTHORITATIVE_DIRECT_SOURCE.json \
            --state1 sac_rlsa_gen7v2/state/STATE_1.json \
            --artifact-root target_artifact \
            --freeze-root sac_rlsa_gen7v2/freeze \
            --cost-rule sac_rlsa_gen7v2/freeze/FROZEN_COST_RULE.json \
            --out-state2 sac_rlsa_gen7v2/state/STATE_2.json \
            --out-bundle sac_rlsa_gen7v2/freeze/FREEZE_BC_BUNDLE_V2.json
          python - <<'PY'
          import json
          t=json.load(open('sac_rlsa_gen7v2/resume/RESUME_FROM_STATE1_TRIGGER.json'))
          b=json.load(open('sac_rlsa_gen7v2/freeze/FREEZE_BC_BUNDLE_V2.json'))
          assert b['freeze_bc_bundle_sha256']==t['expected_freeze_bc_bundle_sha256']
          got={r['seed']:r for r in b['records']}
          for seed,e in t['expected_records'].items():
              r=got[int(seed)]
              for k,v in e.items(): assert r[k]==v,(seed,k,r[k],v)
          assert b['target_truth_accessed'] is False
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sac_rlsa_gen7v2/state/STATE_2.json sac_rlsa_gen7v2/freeze/FREEZE_B* sac_rlsa_gen7v2/freeze/FREEZE_C* sac_rlsa_gen7v2/freeze/FREEZE_BC_BUNDLE_V2.json sac_rlsa_gen7v2/resume/RESUME_FROM_STATE1_TRIGGER.json
          git commit -m 'Gen7 V2R2 STATE_2 public Freeze B/C from preserved STATE_1 artifact [skip ci]'
          git push origin HEAD:sac-rlsa-gen7-authoritative-v2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sac-gen7-v2-resumed-target-bytes
          path: target_artifact/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
  selected-platform:
    timeout-minutes: 60
    needs: freeze-state2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ needs.freeze-state2.outputs.state2_commit }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          name: sac-gen7-v2-resumed-target-bytes
          path: target_artifact
      - name: Execute selected audit only
        run: |
          sac_rlsa_gen7v2/tools/compile_oracle.sh "$RUNNER_TEMP/oracle" "$RUNNER_TEMP/oracle.build.json"
          set +e
          PYTHONDONTWRITEBYTECODE=1 python sac_rlsa_gen7v2/tools/target_selected_platform.py \
            --freeze-a sac_rlsa_gen7v2/freeze/FREEZE_A_V2_AUTHORITATIVE_DIRECT_SOURCE.json \
            --state2 sac_rlsa_gen7v2/state/STATE_2.json \
            --artifact-root target_artifact \
            --freeze-root sac_rlsa_gen7v2/freeze \
            --oracle "$RUNNER_TEMP/oracle" \
            --out SELECTED_${{ matrix.os }}.json --warmups 2 --runs 11
          echo "SELECTED_EXIT=$?" >> "$GITHUB_ENV"
          set -e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sac-gen7-v2-resume-selected-${{ matrix.os }}
          path: SELECTED_${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce selected result
        if: always()
        run: exit "${SELECTED_EXIT:-1}"
  selected-state3:
    timeout-minutes: 30
    needs: [freeze-state2, selected-platform]
    if: ${{ always() && needs.freeze-state2.result == 'success' && needs.selected-platform.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      state3_commit: ${{ steps.state3.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sac-rlsa-gen7-authoritative-v2
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: sac-gen7-v2-resume-selected-ubuntu-latest
          path: selected/ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: sac-gen7-v2-resume-selected-macos-14
          path: selected/macos
      - name: Publicly close STATE_3 before full truth
        id: state3
        run: |
          python sac_rlsa_gen7v2/tools/target_selected_aggregate.py \
            --state2 sac_rlsa_gen7v2/state/STATE_2.json \
            --ubuntu selected/ubuntu/SELECTED_ubuntu-latest.json \
            --macos selected/macos/SELECTED_macos-14.json \
            --out-state3 sac_rlsa_gen7v2/state/STATE_3.json \
            --out sac_rlsa_gen7v2/public_results/SELECTED_AGGREGATE.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sac_rlsa_gen7v2/state/STATE_3.json sac_rlsa_gen7v2/public_results/SELECTED_AGGREGATE.json
          git commit -m 'Gen7 V2R2 STATE_3 selected audits complete before full truth [skip ci]'
          git push origin HEAD:sac-rlsa-gen7-authoritative-v2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  full-platform:
    timeout-minutes: 180
    needs: selected-state3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ needs.selected-state3.outputs.state3_commit }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with:
          name: sac-gen7-v2-resumed-target-bytes
          path: target_artifact
      - uses: actions/download-artifact@v4
        with:
          name: sac-gen7-v2-resume-selected-${{ matrix.os }}
          path: selected
      - name: Execute full truth and complete B7 only after public STATE_3
        run: |
          sac_rlsa_gen7v2/tools/compile_oracle.sh "$RUNNER_TEMP/oracle" "$RUNNER_TEMP/oracle.build.json"
          set +e
          PYTHONDONTWRITEBYTECODE=1 LC_ALL=C python sac_rlsa_gen7v2/tools/target_full_platform.py \
            --freeze-a sac_rlsa_gen7v2/freeze/FREEZE_A_V2_AUTHORITATIVE_DIRECT_SOURCE.json \
            --state3 sac_rlsa_gen7v2/state/STATE_3.json \
            --selected selected/SELECTED_${{ matrix.os }}.json \
            --selected-aggregate sac_rlsa_gen7v2/public_results/SELECTED_AGGREGATE.json \
            --artifact-root target_artifact \
            --freeze-root sac_rlsa_gen7v2/freeze \
            --oracle "$RUNNER_TEMP/oracle" \
            --out FULL_RAW_${{ matrix.os }}.json --warmups 2 --runs 11
          echo "RAW_EXIT=$?" >> "$GITHUB_ENV"
          set -e
          test -f FULL_RAW_${{ matrix.os }}.json
      - name: Apply frozen truth/B7 role separation
        run: |
          set +e
          PYTHONDONTWRITEBYTECODE=1 python sac_rlsa_gen7v2/tools/reclassify_platform_receipt.py \
            --input FULL_RAW_${{ matrix.os }}.json --out FULL_${{ matrix.os }}.json
          echo "RECLASSIFY_EXIT=$?" >> "$GITHUB_ENV"
          set -e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sac-gen7-v2-resume-full-${{ matrix.os }}
          path: |
            FULL_${{ matrix.os }}.json
            FULL_RAW_${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce full-platform result
        if: always()
        run: exit "${RECLASSIFY_EXIT:-1}"
  final-adjudication:
    timeout-minutes: 30
    needs: [selected-state3, full-platform]
    if: ${{ always() && needs.selected-state3.result == 'success' && needs.full-platform.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sac-rlsa-gen7-authoritative-v2
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: sac-gen7-v2-resume-full-ubuntu-latest
          path: full/ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: sac-gen7-v2-resume-full-macos-14
          path: full/macos
      - name: Adjudicate and publish STATE_4 through STATE_6
        run: |
          set +e
          python sac_rlsa_gen7v2/tools/target_full_aggregate_v3.py \
            --state3 sac_rlsa_gen7v2/state/STATE_3.json \
            --ubuntu full/ubuntu/FULL_ubuntu-latest.json \
            --macos full/macos/FULL_macos-14.json \
            --out-state4 sac_rlsa_gen7v2/state/STATE_4.json \
            --out-state5 sac_rlsa_gen7v2/state/STATE_5.json \
            --out-state6 sac_rlsa_gen7v2/state/STATE_6.json \
            --out sac_rlsa_gen7v2/public_results/CROSS_PLATFORM_FINAL_SUMMARY.json
          FINAL_EXIT=$?
          set -e
          cp full/ubuntu/FULL_ubuntu-latest.json sac_rlsa_gen7v2/public_results/
          cp full/macos/FULL_macos-14.json sac_rlsa_gen7v2/public_results/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sac_rlsa_gen7v2/state/STATE_4.json sac_rlsa_gen7v2/state/STATE_5.json sac_rlsa_gen7v2/state/STATE_6.json sac_rlsa_gen7v2/public_results
          git commit -m 'Gen7 V2R2 STATE_6 final canonical cross-platform adjudication [skip ci]'
          git push origin HEAD:sac-rlsa-gen7-authoritative-v2
          exit "$FINAL_EXIT"
