name: SAC RLSA Gen7 canonical truth prospective confirmation
on:
  push:
    branches: [sac-rlsa-gen7-canonical-confirmation]
    paths: ['sac_rlsa_gen7/freeze/RUN_TRIGGER.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-identical-target-bytes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Materialize frozen source bundle
        run: |
          mkdir -p runtime_repo/sac_rlsa_gen7
          python - <<'PY'
          import base64,gzip,io,tarfile
          from pathlib import Path
          b=base64.b64decode(Path('sac_rlsa_gen7/source_bundle.tar.gz.b64').read_bytes().strip(),validate=True)
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(b)),mode='r:') as t:t.extractall('runtime_repo')
          PY
          cp -R sac_rlsa_gen7/freeze runtime_repo/sac_rlsa_gen7/
          mkdir -p runtime_repo/sac_rlsa_gen7/public_records
          cp -R sac_rlsa_gen7/public_records/target_reports runtime_repo/sac_rlsa_gen7/public_records/
      - name: Regenerate and bind public no-truth reports
        run: |
          PYTHONDONTWRITEBYTECODE=1 python runtime_repo/sac_rlsa_gen7/tools/ci_build_targets.py --repo-root runtime_repo --artifact-root ci_artifact --out-manifest ci_artifact_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: sac-gen7-identical-target-bytes
          path: |
            ci_artifact/**
            ci_artifact_manifest.json
          retention-days: 30
          compression-level: 6
  verify-platform:
    needs: build-identical-target-bytes
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, macos-14]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Materialize frozen source bundle
        run: |
          mkdir -p runtime_repo
          python - <<'PY'
          import base64,gzip,io,tarfile
          from pathlib import Path
          b=base64.b64decode(Path('sac_rlsa_gen7/source_bundle.tar.gz.b64').read_bytes().strip(),validate=True)
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(b)),mode='r:') as t:t.extractall('runtime_repo')
          PY
      - uses: actions/download-artifact@v4
        with: {name: sac-gen7-identical-target-bytes, path: ci_bundle}
      - name: Compile frozen oracle
        run: bash runtime_repo/sac_rlsa_gen7/tools/compile_oracle.sh "$RUNNER_TEMP/sac_gen7_oracle"
      - name: Selected RLSA before full truth; complete B7
        run: |
          PYTHONDONTWRITEBYTECODE=1 python runtime_repo/sac_rlsa_gen7/tools/ci_platform_run.py --artifact-root ci_bundle/ci_artifact --freeze-root ci_bundle/ci_artifact/freeze --oracle "$RUNNER_TEMP/sac_gen7_oracle" --warmups 2 --runs 11 --out "platform_${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        with: {name: 'sac-gen7-${{ matrix.os }}', path: 'platform_${{ matrix.os }}.json', retention-days: 30}
  aggregate:
    needs: verify-platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize frozen source bundle
        run: |
          mkdir -p runtime_repo
          python - <<'PY'
          import base64,gzip,io,tarfile
          from pathlib import Path
          b=base64.b64decode(Path('sac_rlsa_gen7/source_bundle.tar.gz.b64').read_bytes().strip(),validate=True)
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(b)),mode='r:') as t:t.extractall('runtime_repo')
          PY
      - uses: actions/download-artifact@v4
        with: {name: sac-gen7-ubuntu-latest, path: receipts/ubuntu}
      - uses: actions/download-artifact@v4
        with: {name: sac-gen7-macos-14, path: receipts/macos}
      - name: Canonical cross-platform adjudication
        run: |
          python runtime_repo/sac_rlsa_gen7/tools/ci_aggregate.py --ubuntu receipts/ubuntu/platform_ubuntu-latest.json --macos receipts/macos/platform_macos-14.json --out CROSS_PLATFORM_SUMMARY.json
      - uses: actions/upload-artifact@v4
        with: {name: sac-gen7-cross-platform-summary, path: CROSS_PLATFORM_SUMMARY.json, retention-days: 30}
