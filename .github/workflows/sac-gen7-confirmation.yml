name: SAC RLSA Gen7 canonical truth prospective confirmation
on:
  push:
    branches: [sac-rlsa-gen7-canonical-confirmation]
    paths: ['sac_rlsa_gen7/freeze/RUN_TRIGGER.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-identical-target-bytes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Extract frozen Gen7 scientific source bundle
        run: python sac_rlsa_gen7/frozen_source_bundle.py --extract .
      - run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Regenerate and bind the already-public no-truth target reports
        run: |
          PYTHONDONTWRITEBYTECODE=1 python sac_rlsa_gen7/tools/ci_build_targets.py \
            --repo-root . --artifact-root ci_artifact --out-manifest ci_artifact_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: sac-gen7-identical-target-bytes
          path: |
            ci_artifact/**
            ci_artifact_manifest.json
          retention-days: 30
          compression-level: 6
  verify-platform:
    needs: build-identical-target-bytes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Extract frozen Gen7 scientific source bundle
        run: python sac_rlsa_gen7/frozen_source_bundle.py --extract .
      - run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with:
          name: sac-gen7-identical-target-bytes
          path: ci_artifact_bundle
      - name: Compile frozen oracle
        run: bash sac_rlsa_gen7/tools/compile_oracle.sh "$RUNNER_TEMP/sac_gen7_oracle"
      - name: Execute selected RLSA before full truth and complete B7 portfolio
        run: |
          PYTHONDONTWRITEBYTECODE=1 python sac_rlsa_gen7/tools/ci_platform_run.py \
            --artifact-root ci_artifact_bundle/ci_artifact \
            --freeze-root ci_artifact_bundle/ci_artifact/freeze \
            --oracle "$RUNNER_TEMP/sac_gen7_oracle" \
            --warmups 2 --runs 11 \
            --out "platform_${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sac-gen7-${{ matrix.os }}
          path: platform_${{ matrix.os }}.json
          retention-days: 30
  aggregate:
    needs: verify-platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract frozen Gen7 scientific source bundle
        run: python sac_rlsa_gen7/frozen_source_bundle.py --extract .
      - uses: actions/download-artifact@v4
        with: {name: sac-gen7-ubuntu-latest, path: receipts/ubuntu}
      - uses: actions/download-artifact@v4
        with: {name: sac-gen7-macos-14, path: receipts/macos}
      - name: Enforce exact raw truth and preregistered interval identity
        run: |
          python sac_rlsa_gen7/tools/ci_aggregate.py \
            --ubuntu receipts/ubuntu/platform_ubuntu-latest.json \
            --macos receipts/macos/platform_macos-14.json \
            --out CROSS_PLATFORM_SUMMARY.json
      - uses: actions/upload-artifact@v4
        with:
          name: sac-gen7-cross-platform-summary
          path: CROSS_PLATFORM_SUMMARY.json
          retention-days: 30
