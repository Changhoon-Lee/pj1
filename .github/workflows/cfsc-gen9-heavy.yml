name: CFSC Gen9 primary cross-platform performance

on:
  push:
    branches: [cfsc-gen9-cross-platform-heavy]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  reproduce:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and verify frozen bundle
        shell: bash
        run: |
          cat cfsc_gen9_external/bundle.part.* > /tmp/gen9_bundle.b64
          python - <<'PY'
          import base64, hashlib, pathlib
          src = pathlib.Path('/tmp/gen9_bundle.b64')
          data = base64.b64decode(src.read_bytes())
          got = hashlib.sha256(data).hexdigest()
          expected = 'c99857c2f415f6fc18df4df06fadb19e8648591acb431750b31af45fcb1cb418'
          if got != expected:
              raise SystemExit(f'bundle SHA mismatch: {got} != {expected}')
          pathlib.Path('/tmp/gen9_bundle.zip').write_bytes(data)
          print(got)
          PY
          rm -rf cfsc_gen9_external/runtime /tmp/gen9_unpacked
          mkdir -p cfsc_gen9_external/runtime
          python - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('/tmp/gen9_bundle.zip') as z:
              z.extractall('/tmp/gen9_unpacked')
          src = pathlib.Path('/tmp/gen9_unpacked/_gen9_external_bundle')
          dst = pathlib.Path('cfsc_gen9_external/runtime')
          for p in src.rglob('*'):
              q = dst / p.relative_to(src)
              if p.is_dir():
                  q.mkdir(parents=True, exist_ok=True)
              else:
                  q.parent.mkdir(parents=True, exist_ok=True)
                  q.write_bytes(p.read_bytes())
          PY
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r cfsc_gen9_external/runtime/requirements.txt
      - name: Run frozen 32-kernel primary performance replication
        working-directory: cfsc_gen9_external/runtime
        run: python run_cross_platform.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfsc-gen9-${{ matrix.os }}
          path: cfsc_gen9_external/runtime/external_reproduction.json
          if-no-files-found: error
