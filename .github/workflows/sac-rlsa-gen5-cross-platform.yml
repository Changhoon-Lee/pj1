name: SAC-RLSA Gen5 cross-platform crossover

on:
  push:
    branches: [sac-rlsa-gen5-cross-platform]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  reproduce:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.65.1
      - name: Execute frozen target partitions
        working-directory: sac_rlsa_gen5_cross_platform
        run: python run_cross_platform.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sac-rlsa-gen5-${{ matrix.os }}
          path: sac_rlsa_gen5_cross_platform/external_reproduction.json
          if-no-files-found: error
