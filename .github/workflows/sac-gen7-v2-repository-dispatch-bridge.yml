name: SAC RLSA Gen7 V2R2 repository-dispatch bridge
on:
  pull_request:
    branches: [master]
    paths:
      - sac_rlsa_gen7v2/freeze/REPOSITORY_DISPATCH_BRIDGE_TRIGGER.json
permissions:
  contents: write
  actions: read
concurrency:
  group: sac-gen7-v2r2-repository-dispatch-bridge
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'sac-rlsa-gen7-authoritative-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: sac-rlsa-gen7-authoritative-v2, fetch-depth: 1}
      - name: Verify single-use bridge marker and unconsumed authority
        id: verify
        run: |
          test -f sac_rlsa_gen7v2/freeze/REPOSITORY_DISPATCH_BRIDGE_TRIGGER.json
          test -f sac_rlsa_gen7v2/freeze/TARGET_RUN_TRIGGER.json
          test ! -f sac_rlsa_gen7v2/state/EXECUTION_LEASE.json
          test ! -f sac_rlsa_gen7v2/state/STATE_1.json
          python - <<'PY'
          import json
          m=json.load(open('sac_rlsa_gen7v2/freeze/REPOSITORY_DISPATCH_BRIDGE_TRIGGER.json'))
          t=json.load(open('sac_rlsa_gen7v2/freeze/TARGET_RUN_TRIGGER.json'))
          s=json.load(open('sac_rlsa_gen7v2/state/STATE_0.json'))
          assert m['schema']=='SAC_GEN7_V2R2_REPOSITORY_DISPATCH_BRIDGE_TRIGGER_V1'
          assert m['single_use'] is True and m['target_execution_authorized'] is True
          assert m['authority_c0_commit']==t['authority_c0_commit']=='dd485518ea792d135f768759fe52814dd7ac1a9c'
          assert m['authority_c1_commit']==t['authority_c1_commit']=='c58c53fe6ef9ab77864916c92e9591bed23b9e8a'
          assert m['target_trigger_digest']==t['trigger_digest']
          assert m['freeze_a_sha256']==t['freeze_a_sha256']==s['freeze_a_sha256']
          assert m['state_0_digest']==t['state_0_digest']==s['state_digest']
          assert m['target_seed_digest']==t['target_seed_digest']==s['target_seed_digest']
          assert m['target_seeds']==t['target_seeds']==s['target_seeds']
          assert s['state']==0 and not s['seeds_consumed'] and not s['target_reports_generated'] and not s['target_truth_accessed']
          print('trigger_digest='+t['trigger_digest'])
          PY
          TRIGGER_DIGEST=$(python - <<'PY'
          import json
          print(json.load(open('sac_rlsa_gen7v2/freeze/TARGET_RUN_TRIGGER.json'))['trigger_digest'])
          PY
          )
          echo "trigger_digest=${TRIGGER_DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Emit exactly one repository_dispatch event and record target run ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_DIGEST: ${{ steps.verify.outputs.trigger_digest }}
        run: |
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d "{\"event_type\":\"sac_gen7_v2r2_single_use_target\",\"client_payload\":{\"trigger_digest\":\"${TRIGGER_DIGEST}\"}}"
          for attempt in $(seq 1 40); do
            sleep 2
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?event=repository_dispatch&per_page=20" > RUNS.json
            RUN_ID=$(python - "$STARTED_AT" <<'PY'
          import datetime,json,sys
          started=datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'))
          data=json.load(open('RUNS.json')); found=[]
          for r in data.get('workflow_runs',[]):
              if r.get('name')!='SAC RLSA Gen7 V2R2 repository-dispatch prospective confirmation': continue
              created=datetime.datetime.fromisoformat(r['created_at'].replace('Z','+00:00'))
              if created>=started: found.append((created,int(r['id']),r))
          if found: print(max(found)[1])
          PY
          )
            if [ -n "$RUN_ID" ]; then
              python - "$RUN_ID" <<'PY'
          import json,sys
          rid=int(sys.argv[1]); data=json.load(open('RUNS.json'))
          r=next(x for x in data['workflow_runs'] if int(x['id'])==rid)
          print('TARGET_REPOSITORY_DISPATCH_RUN='+json.dumps({k:r.get(k) for k in ['id','run_number','status','conclusion','event','head_sha','created_at','html_url','jobs_url','artifacts_url']},sort_keys=True))
          PY
              exit 0
            fi
          done
          echo 'repository_dispatch target run was not discoverable' >&2
          exit 1
