name: SAC RLSA Gen7 V2 single-use prospective confirmation
on:
  push:
    branches: [sac-rlsa-gen7-authoritative-v2]
    paths: [sac_rlsa_gen7v2/freeze/TARGET_RUN_TRIGGER.json]
permissions:
  contents: write
jobs:
  lease-and-state1:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    outputs:
      state1_commit: ${{ steps.state1.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: sac-rlsa-gen7-authoritative-v2, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Require completed history qualification and authoritative protocol
        run: |
          test -f sac_rlsa_gen7v2/preflight/HISTORY_DRY_RUN_QUALIFIED.json
          test -f sac_rlsa_gen7v2/protocol/QUALIFICATION_PROTOCOL_V2.json
          test -f sac_rlsa_gen7v2/freeze/FREEZE_A_V2_AUTHORITATIVE_DIRECT_SOURCE.json
          python - <<'PY'
          import json
          h=json.load(open('sac_rlsa_gen7v2/preflight/HISTORY_DRY_RUN_QUALIFIED.json'))
          p=json.load(open('sac_rlsa_gen7v2/protocol/QUALIFICATION_PROTOCOL_V2.json'))
          assert h['pass'] is True and h['target_seeds_used'] is False
          assert p['classification']['SCIENTIFIC_RULE_DIFF']==0
          assert p['classification']['QUALIFICATION_PROTOCOL_DIFF']==1
          PY
      - name: Acquire single-use public execution lease before reporter
        run: |
          test -f sac_rlsa_gen7v2/freeze/TARGET_RUN_TRIGGER.json
          test ! -f sac_rlsa_gen7v2/state/EXECUTION_LEASE.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          t=json.load(open('sac_rlsa_gen7v2/freeze/TARGET_RUN_TRIGGER.json'))
          x={'schema':'SAC_GEN7_EXECUTION_LEASE_V2','freeze_a_sha256':t['freeze_a_sha256'],'target_seed_digest':t['target_seed_digest'],'single_use_lease_active':True,'target_output_generated':False}
          x['lease_digest']=hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('sac_rlsa_gen7v2/state').mkdir(parents=True,exist_ok=True)
          Path('sac_rlsa_gen7v2/state/EXECUTION_LEASE.json').write_text(json.dumps(x,sort_keys=True,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm sac_rlsa_gen7v2/freeze/TARGET_RUN_TRIGGER.json
          git add sac_rlsa_gen7v2/state/EXECUTION_LEASE.json
          git commit -m 'Gen7 V2 acquire single-use execution lease before target reporting [skip ci]'
          git push origin HEAD:sac-rlsa-gen7-authoritative-v2
      - name: Generate target reports and close STATE_1
        id: state1
        run: |
          mkdir -p target_artifact
          PYTHONDONTWRITEBYTECODE=1 python sac_rlsa_gen7v2/tools/target_generate.py \
            --freeze-a sac_rlsa_gen7v2/freeze/FREEZE_A_V2_AUTHORITATIVE_DIRECT_SOURCE.json \
            --state0 sac_rlsa_gen7v2/state/STATE_0.json \
            --lease sac_rlsa_gen7v2/state/EXECUTION_LEASE.json \
            --artifact-root target_artifact \
            --out-state1 sac_rlsa_gen7v2/state/STATE_1.json \
            --out-manifest target_artifact/TARGET_STATE1_MANIFEST.json
          mkdir -p sac_rlsa_gen7v2/public_records/target_reports
          cp target_artifact/seed*/*.SCIENTIFIC_TARGET_REPORT.json sac_rlsa_gen7v2/public_records/target_reports/
          git add sac_rlsa_gen7v2/state/STATE_1.json sac_rlsa_gen7v2/public_records/target_reports
          git commit -m 'Gen7 V2 STATE_1 target reports generated; seeds permanently consumed [skip ci]'
          git push origin HEAD:sac-rlsa-gen7-authoritative-v2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: sac-gen7-v2-target-bytes, path: target_artifact/**, retention-days: 30, compression-level: 1}
  freeze-state2:
    timeout-minutes: 30
    needs: lease-and-state1
    runs-on: ubuntu-latest
    outputs:
      state2_commit: ${{ steps.state2.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: sac-rlsa-gen7-authoritative-v2, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with: {name: sac-gen7-v2-target-bytes, path: target_artifact}
      - name: Certify and publicly close STATE_2 before any selected audit
        id: state2
        run: |
          PYTHONDONTWRITEBYTECODE=1 python sac_rlsa_gen7v2/tools/target_freeze_bc.py \
            --freeze-a sac_rlsa_gen7v2/freeze/FREEZE_A_V2_AUTHORITATIVE_DIRECT_SOURCE.json \
            --state1 sac_rlsa_gen7v2/state/STATE_1.json \
            --artifact-root target_artifact --freeze-root sac_rlsa_gen7v2/freeze \
            --cost-rule sac_rlsa_gen7v2/freeze/FROZEN_COST_RULE.json \
            --out-state2 sac_rlsa_gen7v2/state/STATE_2.json \
            --out-bundle sac_rlsa_gen7v2/freeze/FREEZE_BC_BUNDLE_V2.json
          git add sac_rlsa_gen7v2/state/STATE_2.json sac_rlsa_gen7v2/freeze/FREEZE_B* sac_rlsa_gen7v2/freeze/FREEZE_C* sac_rlsa_gen7v2/freeze/FREEZE_BC_BUNDLE_V2.json
          git commit -m 'Gen7 V2 STATE_2 public Freeze B/C before selected audit [skip ci]'
          git push origin HEAD:sac-rlsa-gen7-authoritative-v2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  selected-platform:
    timeout-minutes: 60
    needs: freeze-state2
    strategy: {fail-fast: false, matrix: {os: [ubuntu-latest, macos-14]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ needs.freeze-state2.outputs.state2_commit }}}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with: {name: sac-gen7-v2-target-bytes, path: target_artifact}
      - run: |
          sac_rlsa_gen7v2/tools/compile_oracle.sh "$RUNNER_TEMP/oracle" "$RUNNER_TEMP/oracle.build.json"
          PYTHONDONTWRITEBYTECODE=1 python sac_rlsa_gen7v2/tools/target_selected_platform.py \
            --freeze-a sac_rlsa_gen7v2/freeze/FREEZE_A_V2_AUTHORITATIVE_DIRECT_SOURCE.json \
            --state2 sac_rlsa_gen7v2/state/STATE_2.json --artifact-root target_artifact \
            --freeze-root sac_rlsa_gen7v2/freeze --oracle "$RUNNER_TEMP/oracle" \
            --out SELECTED_${{ matrix.os }}.json --warmups 2 --runs 11
      - uses: actions/upload-artifact@v4
        with: {name: 'sac-gen7-v2-selected-${{ matrix.os }}', path: 'SELECTED_${{ matrix.os }}.json', retention-days: 30}
  selected-state3:
    timeout-minutes: 30
    needs: [freeze-state2, selected-platform]
    runs-on: ubuntu-latest
    outputs:
      state3_commit: ${{ steps.state3.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: sac-rlsa-gen7-authoritative-v2, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: sac-gen7-v2-selected-ubuntu-latest, path: selected/ubuntu}
      - uses: actions/download-artifact@v4
        with: {name: sac-gen7-v2-selected-macos-14, path: selected/macos}
      - name: Publicly close STATE_3 before full truth
        id: state3
        run: |
          python sac_rlsa_gen7v2/tools/target_selected_aggregate.py \
            --state2 sac_rlsa_gen7v2/state/STATE_2.json \
            --ubuntu selected/ubuntu/SELECTED_ubuntu-latest.json \
            --macos selected/macos/SELECTED_macos-14.json \
            --out-state3 sac_rlsa_gen7v2/state/STATE_3.json \
            --out sac_rlsa_gen7v2/public_results/SELECTED_AGGREGATE.json
          git add sac_rlsa_gen7v2/state/STATE_3.json sac_rlsa_gen7v2/public_results/SELECTED_AGGREGATE.json
          git commit -m 'Gen7 V2 STATE_3 selected audits complete before full truth [skip ci]'
          git push origin HEAD:sac-rlsa-gen7-authoritative-v2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  full-platform:
    timeout-minutes: 180
    needs: selected-state3
    strategy: {fail-fast: false, matrix: {os: [ubuntu-latest, macos-14]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ needs.selected-state3.outputs.state3_commit }}}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with: {name: sac-gen7-v2-target-bytes, path: target_artifact}
      - uses: actions/download-artifact@v4
        with: {name: 'sac-gen7-v2-selected-${{ matrix.os }}', path: selected}
      - name: Execute raw full-truth and complete B7 portfolio
        run: |
          sac_rlsa_gen7v2/tools/compile_oracle.sh "$RUNNER_TEMP/oracle" "$RUNNER_TEMP/oracle.build.json"
          set +e
          PYTHONDONTWRITEBYTECODE=1 LC_ALL=C python sac_rlsa_gen7v2/tools/target_full_platform.py \
            --freeze-a sac_rlsa_gen7v2/freeze/FREEZE_A_V2_AUTHORITATIVE_DIRECT_SOURCE.json \
            --state3 sac_rlsa_gen7v2/state/STATE_3.json \
            --selected selected/SELECTED_${{ matrix.os }}.json \
            --selected-aggregate sac_rlsa_gen7v2/public_results/SELECTED_AGGREGATE.json \
            --artifact-root target_artifact --freeze-root sac_rlsa_gen7v2/freeze \
            --oracle "$RUNNER_TEMP/oracle" --out FULL_RAW_${{ matrix.os }}.json --warmups 2 --runs 11
          RAW_EXIT=$?
          set -e
          test -f FULL_RAW_${{ matrix.os }}.json
          printf '{"raw_runner_exit":%s,"role_separation":"FROZEN_PRETARGET_PROTOCOL"}\n' "$RAW_EXIT" > FULL_RAW_STATUS_${{ matrix.os }}.json
      - name: Apply frozen canonical-truth/B7 qualification separation
        run: |
          PYTHONDONTWRITEBYTECODE=1 python sac_rlsa_gen7v2/tools/reclassify_platform_receipt.py \
            --input FULL_RAW_${{ matrix.os }}.json --out FULL_${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'sac-gen7-v2-full-${{ matrix.os }}'
          path: |
            FULL_${{ matrix.os }}.json
            FULL_RAW_${{ matrix.os }}.json
            FULL_RAW_STATUS_${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 30
  final-adjudication:
    timeout-minutes: 30
    needs: [selected-state3, full-platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: sac-rlsa-gen7-authoritative-v2, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: sac-gen7-v2-full-ubuntu-latest, path: full/ubuntu}
      - uses: actions/download-artifact@v4
        with: {name: sac-gen7-v2-full-macos-14, path: full/macos}
      - run: |
          python sac_rlsa_gen7v2/tools/target_full_aggregate_v3.py \
            --state3 sac_rlsa_gen7v2/state/STATE_3.json \
            --ubuntu full/ubuntu/FULL_ubuntu-latest.json --macos full/macos/FULL_macos-14.json \
            --out-state4 sac_rlsa_gen7v2/state/STATE_4.json \
            --out-state5 sac_rlsa_gen7v2/state/STATE_5.json \
            --out-state6 sac_rlsa_gen7v2/state/STATE_6.json \
            --out sac_rlsa_gen7v2/public_results/CROSS_PLATFORM_FINAL_SUMMARY.json
          cp full/ubuntu/FULL_ubuntu-latest.json sac_rlsa_gen7v2/public_results/
          cp full/macos/FULL_macos-14.json sac_rlsa_gen7v2/public_results/
          git add sac_rlsa_gen7v2/state/STATE_4.json sac_rlsa_gen7v2/state/STATE_5.json sac_rlsa_gen7v2/state/STATE_6.json sac_rlsa_gen7v2/public_results
          git commit -m 'Gen7 V2 STATE_6 final canonical cross-platform adjudication [skip ci]'
          git push origin HEAD:sac-rlsa-gen7-authoritative-v2
