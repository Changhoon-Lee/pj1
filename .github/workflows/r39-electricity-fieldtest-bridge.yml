name: R39 electricity field-test bridge
on:
  pull_request:
    branches: [master]
    paths: ['r39_electricity/**']
permissions:
  contents: read
jobs:
  measure:
    if: github.head_ref == 'r39-electricity-fieldtest'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: r39-electricity-fieldtest}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python r39_electricity/direct_measurement.py
      - uses: actions/upload-artifact@v4
        with:
          name: r39-direct-monetary-measurement
          path: r39_electricity/DIRECT_MONETARY_MEASUREMENT_MAY2026.json
          retention-days: 3
