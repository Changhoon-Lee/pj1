name: SAC Gen5 development assets

on:
  push:
    branches: [sac-gen5-dev-assets]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public model and CIFAR-10 test data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/pytorch_cifar_models assets/cifar-10-batches-py
          curl -L --fail --retry 5 \
            https://raw.githubusercontent.com/chenyaofo/pytorch-cifar-models/786c16252c0fc58ee9adac063f8337cc4a7a497a/pytorch_cifar_models/resnet.py \
            -o assets/pytorch_cifar_models/resnet.py
          curl -L --fail --retry 5 \
            https://github.com/chenyaofo/pytorch-cifar-models/releases/download/resnet/cifar10_resnet20-4118986f.pt \
            -o assets/cifar10_resnet20-4118986f.pt
          curl -L --fail --retry 5 \
            https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz \
            -o /tmp/cifar-10-python.tar.gz
          tar -xzf /tmp/cifar-10-python.tar.gz -C /tmp
          cp /tmp/cifar-10-batches-py/test_batch assets/cifar-10-batches-py/
          cp /tmp/cifar-10-batches-py/batches.meta assets/cifar-10-batches-py/
          sha256sum assets/pytorch_cifar_models/resnet.py \
                    assets/cifar10_resnet20-4118986f.pt \
                    assets/cifar-10-batches-py/test_batch \
                    assets/cifar-10-batches-py/batches.meta \
                    > assets/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sac-gen5-dev-assets
          path: assets
          compression-level: 0
          if-no-files-found: error
