name: CFSC Gen10 canonical artifact repair

on:
  push:
    branches: [cfsc-gen10-canonical-repair]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-canonical-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct sealed Gen9 runtime
        shell: bash
        run: |
          cat cfsc_gen9_external/bundle.part.* > /tmp/gen9_bundle.b64
          python - <<'PY'
          import base64,hashlib,pathlib,zipfile
          data=base64.b64decode(pathlib.Path('/tmp/gen9_bundle.b64').read_bytes())
          if hashlib.sha256(data).hexdigest()!='c99857c2f415f6fc18df4df06fadb19e8648591acb431750b31af45fcb1cb418': raise SystemExit('bundle mismatch')
          pathlib.Path('/tmp/gen9_bundle.zip').write_bytes(data)
          with zipfile.ZipFile('/tmp/gen9_bundle.zip') as z:z.extractall('/tmp/gen9')
          PY
      - name: Install frozen build dependencies
        run: >-
          python -m pip install --upgrade pip && python -m pip install
          numpy==2.3.5 scipy==1.17.0 networkx==3.6.1 sympy==1.14.0
          scikit-image==0.26.0 scikit-learn==1.8.0 pandas==2.2.3
          statsmodels==0.14.6 biopython==1.86 lxml==6.1.1 pillow==12.2.0
          mpmath==1.3.0 tifffile==2026.5.15 soundfile==0.13.1 rdkit==2025.9.4
          shapely==2.1.2 rasterio==1.5.0 pyproj==3.7.2 gemmi==0.7.4 xarray==2026.4.0
      - name: Build exact frozen canonical bytes
        run: |
          python cfsc_gen10_repair/canonical_repair.py build \
            --runtime /tmp/gen9/_gen9_external_bundle \
            --artifact-root canonical_repair_gen9 \
            --archive gen9_canonical_repair_deterministic.zip \
            --expected-archive-sha 21801e8c579aae1c31fffcd3bf225973ef9b697ea8dc6062b8c03367f87899b3 \
            --receipt build_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: gen9-canonical-bytes
          path: canonical_repair_gen9
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gen9-canonical-build-receipt
          path: |
            build_receipt.json
            gen9_canonical_repair_deterministic.zip
          compression-level: 0
          if-no-files-found: error
  verify-same-bytes:
    needs: build-canonical-bytes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          name: gen9-canonical-bytes
          path: canonical_repair_gen9
      - name: Verify exact downloaded canonical bytes
        run: |
          python cfsc_gen10_repair/canonical_repair.py verify \
            --artifact-root canonical_repair_gen9 \
            --expected-archive-sha 21801e8c579aae1c31fffcd3bf225973ef9b697ea8dc6062b8c03367f87899b3 \
            --receipt canonical_repair_${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: cfsc-gen10-canonical-repair-${{ matrix.os }}
          path: canonical_repair_${{ matrix.os }}.json
          if-no-files-found: error
