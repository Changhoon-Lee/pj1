name: SAC RLSA Gen7 V2 single-use target dispatcher
on:
  pull_request:
    branches: [master]
    paths:
      - sac_rlsa_gen7v2/freeze/TARGET_RUN_TRIGGER.json
      - .github/workflows/sac-gen7-v2-target-dispatcher.yml
permissions:
  actions: write
  contents: read
concurrency:
  group: sac-gen7-v2r2-target-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'sac-rlsa-gen7-authoritative-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sac-rlsa-gen7-authoritative-v2
          fetch-depth: 1
      - name: Verify frozen trigger and absence of consumed-state evidence
        run: |
          test -f sac_rlsa_gen7v2/freeze/TARGET_RUN_TRIGGER.json
          test ! -f sac_rlsa_gen7v2/state/EXECUTION_LEASE.json
          test ! -f sac_rlsa_gen7v2/state/STATE_1.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def digest(x):
              return hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          t=json.load(open('sac_rlsa_gen7v2/freeze/TARGET_RUN_TRIGGER.json'))
          s=json.load(open('sac_rlsa_gen7v2/state/STATE_0.json'))
          f=json.load(open('sac_rlsa_gen7v2/freeze/FREEZE_A_V2_AUTHORITATIVE_DIRECT_SOURCE.json'))
          c=dict(t); stored=c.pop('trigger_digest')
          assert digest(c)==stored
          assert t['schema']=='SAC_GEN7_V2R2_SINGLE_USE_TARGET_TRIGGER_V1'
          assert t['target_execution_authorized'] is True and t['single_use'] is True
          assert t['authority_c0_commit']=='dd485518ea792d135f768759fe52814dd7ac1a9c'
          assert t['authority_c1_commit']=='c58c53fe6ef9ab77864916c92e9591bed23b9e8a'
          assert t['freeze_a_sha256']==f['freeze_a_sha256']==s['freeze_a_sha256']
          assert t['state_0_digest']==s['state_digest']
          assert t['target_seed_digest']==s['target_seed_digest']
          assert t['target_seeds']==s['target_seeds']==f['untouched_target_seeds']
          assert s['state']==0 and not s['seeds_consumed'] and not s['target_reports_generated'] and not s['target_truth_accessed']
          print(json.dumps({'pass':True,'trigger_digest':stored,'target_seeds':s['target_seeds']},sort_keys=True))
          PY
      - name: Dispatch the registered target workflow on the frozen authority branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/sac-gen7-v2-target-single-use.yml/dispatches" \
            -d '{"ref":"sac-rlsa-gen7-authoritative-v2"}'
